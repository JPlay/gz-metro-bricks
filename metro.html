<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F6CF1B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%23F6CF1B%27/%3E%3Cpath d=%27M14 43h36v6H14zM18 14h28v26H18z%27 fill=%27%23233447%27/%3E%3C/svg%3E">
<title>今天，我坐广州地铁！</title>
<link rel="stylesheet" href="css/metro.css?v=play-round3-22">
</head>
<body>
<main id="app">
  <canvas id="scene" aria-label="第一人称积木地铁，拖动转头，点发光脚印走路"></canvas>
  <header id="topbar"><a class="brand" href="index.html" aria-label="返回积木拼搭">▦ <span>积木小列车<small>广州地铁 · 1号线</small></span></a><div id="trip"></div><button id="sound" aria-label="关闭声音">声音 开</button><button id="routeBtn" aria-label="查看旅程">线路图</button></header>
  <div id="hud" hidden>
    
    <div id="phase" hidden><span id="stepCount"></span><span id="phaseName"></span></div>
    <div id="token" hidden><span class="coin"></span><span>单程票在这里</span></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <button id="worldTarget" hidden><span>👣</span><b></b></button>
    <button id="findInteraction" hidden>↪ 看回这里</button>
  <button id="interactionTarget" hidden></button><button id="handCoin" hidden><span class="coin"></span><b></b></button><div id="coinFlight" class="coin" hidden></div>
    <div id="lookHint">拖动转头看 · 点脚印自动走</div>
    <div id="travelControls"><div id="seatControls" hidden><button id="seat">坐到座位上</button><button id="stand">站起来</button></div><button id="secondary" hidden></button></div>
    <footer id="objective"><div><span id="objectiveTag"></span><h1 id="goal"></h1><p id="detail"></p><div id="timerBar" hidden><i></i></div></div><button id="action" class="primary"></button></footer>
  </div>
  <section id="loading" class="overlay"><div class="loading-card"><div class="train-icon">▰▰▰</div><p class="eyebrow">今天的小小探险</p><h1>今天，我坐广州地铁！</h1><p>积木城市里的第一人称旅程</p><progress id="loadProgress" max="100" value="0"></progress><p id="loadText">正在准备车站…</p></div></section>
  <section id="selection" class="overlay" hidden><div class="selection-card"><div class="intro"><p class="eyebrow">广州地铁 · 1号线</p><h1>我们去哪儿玩？</h1><p>选一个上车站，再选一个下车站。</p></div><div class="pick-label"><b>① 从这里上车</b><b>② 到这里下车</b></div><div id="stationPicker"></div><div class="journey-preview"><span id="routePreview"></span><span id="farePreview"></span></div><p class="control-note">👆 点发光脚印走路　↔ 拖动屏幕转头　🔊 听三语报站</p><button id="start" class="primary">出发，去坐地铁！</button></div></section>
  <section id="mapModal" class="overlay" hidden><div class="map-card"><p class="eyebrow">我的旅程</p><h1>坐上黄色的 1号线</h1><div id="routeStrip" aria-label="沿途车站"></div><div id="mapStations"></div><p id="mapText"></p><button id="closeMap" class="primary">继续我的旅程</button><button id="chooseAgain">重新选站</button></div></section>
  <section id="finish" class="overlay" hidden><div class="finish-card"><div class="finish-badge">★</div><p class="eyebrow">小小乘客 · 旅程完成</p><h1 id="finishTitle"></h1><p id="finishDetail"></p><div class="achievements"><span>✓ 买票过闸</span><span>✓ 先下后上</span><span>✓ 听报站到站</span></div><button id="restart" class="primary">再坐一次地铁！</button><a href="index.html">回去拼积木列车</a></div></section>
  <div id="fade"></div>
  <div id="fatal" hidden role="alert"><h1>小列车暂时没准备好</h1><p id="fatalText"></p><button onclick="location.reload()">重新打开</button></div>
</main>
<script src="three.min.js"></script>
<script src="js/metro/config.js?v=20261006"></script>
<script src="js/metro/play-physics.js?v=play-round3-22"></script>
<script src="js/metro/npc.js?v=play-round3-22"></script>
<script src="js/metro/main.js?v=play-round3-22"></script>
</body>
</html>
