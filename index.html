<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>积木小列车 · 广州地铁1号线</title>
<style>
  :root{
    --yellow:#F6CF1B; --red:#D01F2D; --ink:#2b2f36; --paper:#fffdf5;
    --sky1:#bfe6ff; --sky2:#eef9ff; --shadow:0 6px 0 rgba(0,0,0,.16);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-touch-callout:none}
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;background:var(--sky1);color:var(--ink);
    font-family:"Yuanti SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none}
  #app{height:100%;display:flex;flex-direction:column}

  header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--yellow);
    border-bottom:6px solid var(--red);padding-top:max(10px,env(safe-area-inset-top))}
  header h1{font-size:20px;margin:0;white-space:nowrap;letter-spacing:1px}
  header h1 small{font-size:13px;font-weight:600;opacity:.75;margin-left:6px}
  #dots{flex:1;display:flex;gap:5px;justify-content:center;min-width:0}
  #dots i{width:22px;height:22px;border-radius:50%;background:#fff8;border:3px solid #0002;flex:none;
    display:grid;place-items:center;font-style:normal;font-size:12px;transition:.25s}
  #dots i.done{background:var(--red);border-color:#8f0f1a;color:#fff;transform:scale(1.08)}
  #dots i.now{background:#fff;border-color:var(--red);transform:scale(1.25)}
  .mini{border:0;background:#fff;border-radius:14px;height:44px;min-width:44px;padding:0 12px;font:inherit;
    font-weight:700;font-size:15px;box-shadow:0 4px 0 rgba(0,0,0,.18);cursor:pointer}
  .mini:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}

  #stage{flex:1;position:relative;min-height:0;background:linear-gradient(var(--sky1),var(--sky2))}
  #stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #stage canvas:active{cursor:grabbing}
  #hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#fff;border-radius:99px;
    padding:8px 16px;font-size:15px;font-weight:700;box-shadow:var(--shadow);pointer-events:none;transition:opacity .6s;white-space:nowrap}
  #play{position:absolute;right:10px;top:10px;bottom:10px;display:flex;flex-direction:column;gap:8px;
    justify-content:center;pointer-events:none}
  #play button{pointer-events:auto;border:0;border-radius:18px;width:76px;height:58px;white-space:nowrap;background:#fff;font:inherit;
    font-weight:800;font-size:13px;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:1px;transition:filter .2s,opacity .2s}
  #play button b{font-size:24px;line-height:1.05}
  #play button:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.16)}
  #play button.on{background:var(--yellow)}
  #play button.locked{opacity:.45;filter:grayscale(1)}
  #tools{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:8px}
  #colors{position:absolute;left:10px;bottom:10px;display:flex;gap:8px;background:#fff;padding:8px;border-radius:99px;box-shadow:var(--shadow)}
  #colors button{width:34px;height:34px;border-radius:50%;border:3px solid #0003;cursor:pointer;padding:0}
  #colors button.on{outline:4px solid var(--ink);outline-offset:1px}

  #panel{display:flex;align-items:stretch;gap:12px;padding:12px 14px;background:var(--paper);
    border-top:6px solid var(--yellow);padding-bottom:max(12px,env(safe-area-inset-bottom))}
  .big{flex:none;width:92px;border:0;border-radius:22px;font:inherit;font-weight:900;font-size:17px;color:#fff;
    background:#3aa655;box-shadow:0 7px 0 #1f6e36;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .big b{font-size:32px;line-height:1}
  .big:active{transform:translateY(5px);box-shadow:0 2px 0 #1f6e36}
  .big.prev{background:#8b96a3;box-shadow:0 7px 0 #5d6672;width:76px}
  .big.prev:active{box-shadow:0 2px 0 #5d6672}
  .big:disabled{opacity:.35;pointer-events:none}
  .big.pulse{animation:pulse 1.2s infinite}
  @keyframes pulse{50%{transform:scale(1.06)}}
  #card{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;justify-content:center}
  #card .top{display:flex;align-items:center;gap:10px}
  #badge{flex:none;background:var(--red);color:#fff;font-weight:900;border-radius:12px;padding:4px 12px;font-size:16px}
  #title{font-size:22px;font-weight:900;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #desc{margin:0;font-size:16px;line-height:1.45;font-weight:600;color:#4a5160}
  #parts{display:flex;gap:6px;flex-wrap:wrap;max-height:74px;overflow:auto}
  .chip{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid #0001;border-radius:12px;padding:3px 9px 3px 5px;font-size:13px;font-weight:700}
  .chip u{flex:none;width:26px;height:16px;border-radius:4px;border:2px solid #0004;position:relative;text-decoration:none}
  .chip u:before,.chip u:after{content:"";position:absolute;top:-6px;width:7px;height:4px;border-radius:2px 2px 0 0;background:inherit;border:2px solid #0004;border-bottom:0}
  .chip u:before{left:1px}.chip u:after{right:1px}
  .chip em{font-style:normal;color:var(--red);font-weight:900}

  #route{position:absolute;left:50%;top:8px;transform:translateX(-50%);display:none;background:#fffd;border-radius:16px;
    padding:8px 12px 8px;box-shadow:var(--shadow);pointer-events:none;align-items:flex-start}
  #route.on{display:flex}
  #route span{display:flex;flex-direction:column;align-items:center;gap:4px;width:25px;border-top:5px solid var(--yellow);
    font-size:12px;font-weight:800;color:#555}
  #route span i{width:13px;height:13px;border-radius:50%;background:#fff;border:3px solid var(--yellow);margin-top:-9px}
  #route span b{writing-mode:vertical-rl;letter-spacing:1px;font-weight:800}
  #route span.past{color:#aaa;border-top-color:#ccc} #route span.past i{border-color:#ccc}
  #route span.cur{color:var(--red)} #route span.cur i{background:var(--red);border-color:#8f0f1a;transform:scale(1.35)}
  #route span.next i{animation:blink .7s infinite} @keyframes blink{50%{background:var(--red)}}
  #views{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:none;gap:6px;background:#fff;padding:6px;border-radius:99px;box-shadow:var(--shadow)}
  #views button{border:0;border-radius:99px;height:42px;padding:0 14px;font:inherit;font-weight:800;font-size:14px;background:#eef1f4;cursor:pointer;white-space:nowrap}
  #views button.on{background:var(--yellow)}
  #fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .45s}
  #modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
  #modal.show{display:flex}
  #modal .box{background:#fff;border-radius:24px;padding:16px;max-width:760px;width:100%;max-height:100%;overflow:auto}
  #modal h2{margin:0 0 10px;font-size:20px;display:flex;justify-content:space-between;align-items:center}
  #modal .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  #modal figure{margin:0}
  #modal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;display:block}
  #modal figcaption{text-align:center;font-weight:800;padding-top:4px}
  .confetti{position:fixed;top:-40px;font-size:28px;z-index:9;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

  @media (max-width:720px){
    header h1{font-size:16px} header h1 small{display:none}
    #dots i{width:14px;height:14px;font-size:0;border-width:2px}
    #panel{gap:8px;padding:10px} .big{width:72px;font-size:14px} .big.prev{width:56px} .big b{font-size:26px}
    #title{font-size:18px} #desc{font-size:14px} #parts{max-height:54px}
    #play button{width:62px;height:52px;font-size:11px;border-radius:14px} #play button b{font-size:20px}
    #colors button{width:28px;height:28px}
    #views{bottom:60px} #views button{height:36px;padding:0 10px;font-size:12px}
    #route span{width:17px;font-size:10px}
  }
  @media (max-height:520px){ #desc{display:none} #parts{max-height:30px} #play button{height:44px} #play button b{font-size:17px} }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🚇 积木小列车<small>广州地铁 1 号线</small></h1>
    <div id="dots"></div>
    <a class="mini" id="btnRide" href="metro.html" style="display:flex;align-items:center;text-decoration:none;color:inherit;background:var(--red);color:#fff">🚇 去坐地铁</a>
    <button class="mini" id="btnPhoto" title="看看真模型">📷</button>
    <button class="mini" id="btnSound" title="声音">🔊</button>
  </header>

  <div id="stage">
    <canvas id="c"></canvas>
    <div id="hint">👆 用手指拖一拖，可以转着看</div>
    <div id="tools">
      <button class="mini" id="btnExplode">💥 拆开看</button>
      <button class="mini" id="btnAll">⏩ 一键拼好</button>
      <button class="mini" id="btnReset">🔄 重新拼</button>
      <button class="mini" id="btnMetro">🚇 坐地铁</button>
    </div>
    <div id="colors"></div>
    <div id="route"></div>
    <div id="views">
      <button data-v="orbit" class="on">👀 外面看</button>
      <button data-v="cab">🧑‍✈️ 司机</button>
      <button data-v="seat">🧍 乘客</button>
    </div>
    <div id="fade"></div>
    <div id="play">
      <button id="pDrive"><b>🚆</b>开车</button>
      <button id="pDoor"><b>🚪</b>开门</button>
      <button id="pLight"><b>💡</b>车灯</button>
      <button id="pPanto"><b>⚡</b>受电弓</button>
      <button id="pHorn"><b>📯</b>按住鸣笛</button>
      <button id="pCars"><b>🚃</b>车厢</button>
    </div>
  </div>

  <div id="panel">
    <button class="big prev" id="btnPrev"><b>◀</b>上一步</button>
    <div id="card">
      <div class="top"><span id="badge"></span><h2 id="title"></h2></div>
      <p id="desc"></p>
      <div id="parts"></div>
    </div>
    <button class="big" id="btnNext"><b>▶</b><span>下一步</span></button>
  </div>
</div>

<div id="modal">
  <div class="box">
    <h2>📷 这是真的模型，对照着看一看 <button class="mini" id="btnClose">✖</button></h2>
    <div class="grid">
      <figure><img src="assets/side.jpg" alt="侧面"><figcaption>侧面</figcaption></figure>
      <figure><img src="assets/front.jpg" alt="车头"><figcaption>车头</figcaption></figure>
      <figure><img src="assets/top.jpg" alt="车顶"><figcaption>车顶</figcaption></figure>
      <figure><img src="assets/bottom.jpg" alt="车底"><figcaption>车底</figcaption></figure>
    </div>
  </div>
</div>

<script src="three.min.js"></script>
<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);

/* ───────── 颜色与材质 ───────── */
const HEX = { body:'#F6CF1B', red:'#D01F2D', dk:'#5B6066', lt:'#A9AEB3', trans:'#31424d',
              light:'#FFF6D6', silver:'#D9DDE0', panto:'#C8102E', black:'#22252a' };
const CNAME = { body:'黄色', red:'红色', dk:'深灰', lt:'浅灰', trans:'透明', light:'车灯', silver:'银色', panto:'红色', black:'黑色' };
const mats = {};
for (const k in HEX) mats[k] = new THREE.MeshStandardMaterial({ color:HEX[k], roughness:.38, metalness:.02 });
mats.trans.transparent = true; mats.trans.opacity = .62; mats.trans.roughness = .1;
mats.silver.metalness = .7; mats.silver.roughness = .3;
mats.light.emissive = new THREE.Color('#ffe9a0'); mats.light.emissiveIntensity = 0;

/* ───────── 积木几何体（1 颗粒 = 1，薄板高 = 0.4） ───────── */
const P = .4, L = 40;
function merge(geos){
  let n = 0; geos.forEach(g => n += g.attributes.position.count);
  const pos = new Float32Array(n*3), nor = new Float32Array(n*3); let o = 0;
  geos.forEach(g => { pos.set(g.attributes.position.array, o); nor.set(g.attributes.normal.array, o); o += g.attributes.position.count*3; });
  const m = new THREE.BufferGeometry();
  m.setAttribute('position', new THREE.BufferAttribute(pos,3));
  m.setAttribute('normal', new THREE.BufferAttribute(nor,3));
  return m;
}
const geoCache = {};
function brickGeo(w,d,h,studs){
  const key = [w,d,h,studs].join('_');
  if (geoCache[key]) return geoCache[key];
  const g = .025, hh = h*P;
  const parts = [ new THREE.BoxGeometry(w-2*g, hh-g, d-2*g).toNonIndexed().translate(0, g/2, 0) ];
  if (studs) for (let i=0;i<w;i++) for (let j=0;j<d;j++)
    parts.push(new THREE.CylinderGeometry(.3,.3,.17,12).toNonIndexed().translate(-w/2+.5+i, hh/2+.085, -d/2+.5+j));
  return geoCache[key] = merge(parts);
}

/* ───────── 列车积木清单 ───────── */
const DOORS = [4,12,20,28,36];
const SIDES = [0,5];
// type：'head' 带驾驶室的头车；'midP' 带受电弓的中间车；'mid' 不带受电弓的中间车
function carBricks(type){
  const B = []; let cur = 0;
  const mid = type !== 'head', hasPanto = type !== 'mid';
  const SEGS = [[mid?0:1,4],[6,12],[14,20],[22,28],[30,36],[38,40]];
  const brick = (x,y,z,w,d,h,color,o) => B.push(Object.assign({x,y,z,w,d,h,color,step:cur}, o||{}));
  const gangway = x => { brick(x,1,1,1,1,12,'lt',{name:'贯通道立柱'}); brick(x,1,4,1,1,12,'lt',{name:'贯通道立柱'}); brick(x,13,1,1,4,2,'lt',{name:'贯通道横梁'}); };

  cur = 1; // 轮子和转向架
  [7,33].forEach(cx => {
    brick(cx-3,-1,1,6,4,1,'dk',{name:'转向架底板'});
    brick(cx-2,-3,2,4,2,2,'dk',{name:'转向架'});
    [-1.5,1.5].forEach(dx => [.8,5.2].forEach(z => B.push({kind:'wheel',cx:cx+dx,cy:-2.2,cz:z,color:'black',step:cur,name:'车轮',y:-3})));
  });

  cur = 2; // 车底板
  for (let i=0;i<4;i++) brick(i*10,0,0,10,6,1,'dk');
  [[12,0,4],[17,0,3],[22,0,4],[13,4,4],[19,4,3],[24,4,3]].forEach(a => brick(a[0],-3,a[1],a[2],2,3,'dk',{name:'车底设备箱',smooth:true}));
  brick(-1,-1,2,2,2,1,'lt',{name:'车钩',smooth:true});
  brick(39,-1,2,2,2,1,'lt',{name:'车钩',smooth:true});
  brick(40,0,1,1,4,1,'lt');
  if (mid) brick(-1,0,1,1,4,1,'lt');

  cur = 3; // 车身底层
  if (!mid) brick(0,1,0,1,6,2,'body');
  SIDES.forEach(z => SEGS.forEach(s => brick(s[0],1,z,s[1]-s[0],1,3,'body')));

  cur = 4; // 红腰线和车灯
  if (!mid){
    brick(0,3,0,1,2,1,'light',{name:'车灯'}); brick(0,3,2,1,2,1,'body'); brick(0,3,4,1,2,1,'light',{name:'车灯'});
    brick(0,4,0,1,2,1,'red'); brick(0,4,2,1,2,1,'body'); brick(0,4,4,1,2,1,'red');
    brick(0,5,0,1,6,1,'body');
  }
  SIDES.forEach(z => SEGS.forEach(s => { brick(s[0],4,z,s[1]-s[0],1,1,'red'); brick(s[0],5,z,s[1]-s[0],1,1,'body'); }));

  cur = 5; // 车窗
  if (!mid){
    brick(0,6,0,1,2,6,'trans',{name:'挡风玻璃'});
    brick(0,6,2,1,2,6,'body',{decal:'logo'});
    brick(0,6,4,1,2,6,'trans',{name:'挡风玻璃'});
  }
  SIDES.forEach(z => SEGS.forEach((s,i) => {
    const a = s[0], b = s[1];
    if (i === 0 && !mid) { brick(a,6,z,2,1,6,'trans'); brick(b-1,6,z,1,1,6,'body'); }
    else if (b-a === 2) brick(a,6,z,2,1,6,'body');
    else { brick(a,6,z,1,1,6,'body'); brick(a+1,6,z,b-a-2,1,6,'trans'); brick(b-1,6,z,1,1,6,'body'); }
  }));

  cur = 6; // 车门
  SIDES.forEach(z => DOORS.forEach(x0 => [0,1].forEach(i => {
    const door = { dir: i ? 1 : -1 };
    brick(x0+i,1,z,1,1,3,'body',{door,name:'车门下半'});
    brick(x0+i,4,z,1,1,1,'red',{door});
    brick(x0+i,5,z,1,1,1,'body',{door});
    brick(x0+i,6,z,1,1,6,'trans',{door,name:'车门玻璃'});
  })));

  cur = 7; // 贯通道
  gangway(40); if (mid) gangway(-1);

  cur = 8; // 车顶横梁
  if (!mid) brick(0,12,0,1,6,3,'body',{decal:'num'});
  SIDES.forEach(z => {
    if (mid) brick(0,12,z,8,1,3,'body'); else { brick(1,12,z,3,1,3,'body'); brick(4,12,z,4,1,3,'body'); }
    for (let x=8;x<40;x+=8) brick(x,12,z,8,1,3,'body');
  });

  cur = 9; // 车顶
  for (let i=0;i<4;i++) brick(i*10,15,0,10,6,1,'body');
  brick(7,16,1,8,4,1,'body'); brick(15,16,1,8,4,1,'body');
  if (hasPanto){ brick(23,16,1,6,4,1,'body'); brick(29,16,1,4,4,1,'dk',{name:'受电弓底座',smooth:true}); }
  else brick(23,16,1,10,4,1,'body');
  brick(1,16,1,6,4,2,'body',{name:'空调机组',smooth:true});
  brick(33,16,1,6,4,2,'body',{name:'空调机组',smooth:true});

  cur = 10; // 空调风扇、盖板、受电弓
  [2.5,3.7,36.3,37.5].forEach(x => B.push({kind:'fan',cx:x,cy:18,cz:3,color:'silver',step:cur,name:'空调风扇',y:18}));
  [9,13,18,22].forEach(x => [1,4].forEach(z => brick(x,17,z,2,1,1,'body',{name:'车顶小盖板',smooth:true})));
  if (hasPanto) B.push({kind:'panto',cx:31,cy:17,cz:3,color:'panto',step:cur,name:'受电弓',y:17});
  return B;
}
const B = carBricks('head');

const STEPS = [
  null,
  { t:'装上小轮子',     d:'先摆好两个转向架，每个转向架有 4 个轮子，一共 8 个轮子。' },
  { t:'铺好车底板',     d:'把长长的深灰色底板盖在轮子上，再装上车底的设备箱和车钩。' },
  { t:'砌一圈黄色车身', d:'用黄色积木沿着底板边上围一圈，记得给车门留出空位哦！' },
  { t:'贴上红色腰线',   d:'放一圈红色薄板，这是 1 号线的红腰带。车头再装上两盏车灯。' },
  { t:'装上车窗',       d:'把透明的窗户积木放上去，车头是两块大大的挡风玻璃。' },
  { t:'装上车门',       d:'一边 5 扇门，每扇门有两片门板，把它们插进留好的空位里。' },
  { t:'接上贯通道',     d:'车尾的灰色框框叫贯通道，乘客可以从这里走到下一节车厢。' },
  { t:'架好车顶横梁',   d:'用长长的黄色积木把车窗和车门压住，车头上面有车号 2930。' },
  { t:'盖上车顶',       d:'盖上大块的车顶板，两头再各放一个空调机组。' },
  { t:'装上受电弓',     d:'再装上空调风扇、小盖板和红色的受电弓，这一节车厢就拼好啦！' },
  { t:'连成一整列车',   d:'再开来 5 节车厢，一节一节挂上去，变成 6 节的 1 号线列车！最后一节也有驾驶室。' },
];
const N = STEPS.length - 1;

/* ───────── three.js 场景 ───────── */
const canvas = $('c'), stage = $('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });

function makePanto(){
  const g = new THREE.Group(), m = mats.panto, bar = (w,h,d) => new THREE.Mesh(new THREE.BoxGeometry(w,h,d), m);
  const base = bar(2.6,.14,.16); base.position.set(0,.08,-1); g.add(base);
  const base2 = base.clone(); base2.position.z = 1; g.add(base2);
  const cross = bar(.16,.14,2.1); cross.position.set(-1.1,.08,0); g.add(cross);
  const lower = new THREE.Group(); lower.position.set(-1.1,.18,0); g.add(lower);
  const la = bar(2,.13,.5); la.position.x = 1; lower.add(la);
  const upper = new THREE.Group(); upper.position.x = 2; lower.add(upper);
  const ua = bar(2,.11,.3); ua.position.x = -1; upper.add(ua);
  const head = new THREE.Group(); head.position.x = -2; upper.add(head);
  const h1 = bar(.22,.1,2.6); h1.position.y = .1; head.add(h1);
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  g.userData.set = a => { const th = a*.62; lower.rotation.z = th; upper.rotation.z = -2*th; head.rotation.z = th; };
  g.userData.set(0);
  return g;
}

function special(b){ // 车轮、风扇、受电弓

    obj = new THREE.Mesh(new THREE.CylinderGeometry(.7,.7,.4,20).rotateX(Math.PI/2), mats.black);
    obj.add(new THREE.Mesh(new THREE.BoxGeometry(1.05,.3,.46), mats.silver));
    obj.add(new THREE.Mesh(new THREE.BoxGeometry(.3,1.05,.46), mats.silver));
    obj.userData.sgn = 1; target = W(b.cx, b.cy*P, b.cz);
  } else if (b.kind === 'fan'){
    obj = new THREE.Mesh(new THREE.CylinderGeometry(.46,.46,.14,18), mats.silver);
    const x1 = new THREE.Mesh(new THREE.BoxGeometry(.8,.05,.1), mats.dk); x1.position.y = .08; obj.add(x1);
    const x2 = x1.clone(); x2.rotation.y = Math.PI/2; obj.add(x2);
    target = W(b.cx, b.cy*P + .07, b.cz);
  } else { obj = makePanto(); target = W(b.cx, b.cy*P, b.cz); }
  if (obj.isMesh){ obj.castShadow = true; obj.receiveShadow = true; }
  return { obj, target };
}

function staticCar(type, flip){
  const g = new THREE.Group(), buckets = {}, dg = {};
  carBricks(type).forEach(b => {
    if (b.kind){ const sp = special(b); sp.obj.position.copy(sp.target); g.add(sp.obj); register(b, sp.obj, flip); return; }
    const t = brickTarget(b), key = b.color + '|' + (b.door ? b.door.dir + '_' + (t.z < 0 ? 1 : -1) : '');
    (buckets[key] = buckets[key] || []).push(brickGeo(b.w,b.d,b.h,!b.smooth).clone().translate(t.x,t.y,t.z));
    if (b.decal){ const d = decalMesh(b); d.position.add(t); g.add(d); }
  });
  Object.keys(buckets).forEach(key => {
    const [color, dk] = key.split('|');
    const m = new THREE.Mesh(merge(buckets[key]), mats[color]); m.castShadow = true; m.receiveShadow = true;
    if (!dk) return g.add(m);
    if (!dg[dk]){ const a = dk.split('_').map(Number); dg[dk] = new THREE.Group(); dg[dk].userData = { dir:a[0], sgn:a[1] }; g.add(dg[dk]); doorLeaves.push(dg[dk]); }
    dg[dk].add(m);
  });
  g.add(interiorGroup());
  if (flip) g.rotation.y = Math.PI;
  g.visible = false; g.userData.slide = 0; train.add(g);
  return g;
}

let AC = null, soundOn = true;
function ac(){ if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, t0, dur, type, vol, f2){
  const a = ac(); if (!a || !soundOn) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + (t0||0);
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t+dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol||.2, t+.01); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+.05);
}
let lastClick = 0;
const sfx = {
  click(){ const n = performance.now(); if (n-lastClick < 55) return; lastClick = n; tone(900+Math.random()*500, 0, .06, 'square', .07, 300); },
  tada(){ [523,659,784,1047,1319].forEach((f,i) => tone(f, i*.11, .35, 'triangle', .2)); },
  chime(){ [880,880,880].forEach((f,i) => tone(f, i*.22, .14, 'sine', .22)); },
  clack(){ tone(120,0,.07,'square',.12,60); tone(120,.13,.07,'square',.12,60); },
  pop(){ tone(500,0,.12,'sine',.2,900); },
};
// 鸣笛：两个音叠在一起、持续不衰减的电笛声，按住多久响多久
let horn = null;
function hornStart(){
  const a = ac(); if (!a || !soundOn || horn) return;
  const t = a.currentTime, g = a.createGain(), f = a.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = 2400; f.Q.value = .7;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.22, t+.05);
  f.connect(g); g.connect(a.destination);
  const oscs = [[349,'sawtooth',.5],[440,'sawtooth',.5],[351.5,'sawtooth',.3],[880,'square',.07]].map(v => {
    const o = a.createOscillator(), og = a.createGain(); o.type = v[1]; og.gain.value = v[2];
    o.frequency.setValueAtTime(v[0]*.96, t); o.frequency.linearRampToValueAtTime(v[0], t+.08);
    o.connect(og); og.connect(f); o.start(t); return o; });
  horn = { g, oscs, t0:t, timer:setTimeout(hornStop, 4000) };
}
function hornStop(){
  if (!horn) return; const h = horn; horn = null; clearTimeout(h.timer);
  const t = Math.max(AC.currentTime, h.t0 + .55); // 轻轻点一下也至少响半秒
  h.g.gain.cancelScheduledValues(t); h.g.gain.setValueAtTime(.22, t); h.g.gain.linearRampToValueAtTime(0, t+.12);
  h.oscs.forEach(o => o.stop(t+.16));
}
function say(text){
  if (!soundOn || !window.speechSynthesis) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'zh-CN'; u.rate = .95; u.pitch = 1.15; speechSynthesis.speak(u); } catch(e){}
}

const S = { step:0, explode:0, explodeT:0, door:0, doorT:0, driving:false, speed:0, lights:false, panto:0, pantoT:0, dist:0, clackAt:0, cars:1, trainX:0, half:21 };

function partName(b){
  if (b.name) return b.name;
  const a = Math.min(b.w,b.d), c = Math.max(b.w,b.d);
  if (b.color === 'trans') return a+'×'+c+' 车窗';
  return a+'×'+c+(b.h === 1 ? ' 薄板' : b.h === 2 ? ' 厚板' : b.h === 3 ? ' 砖' : ' 高砖');
}
function renderPanel(){
  const dots = $('dots'); dots.innerHTML = '';
  for (let i=1;i<=N;i++){ const d = document.createElement('i'); d.textContent = i < S.step ? '★' : i; d.className = i < S.step ? 'done' : i === S.step ? 'now' : ''; if (built()) { d.className = 'done'; d.textContent = '★'; } dots.appendChild(d); }
  const parts = $('parts'); parts.innerHTML = '';
  if (S.step === 0){
    $('badge').textContent = '准备'; $('title').textContent = '一起来拼广州地铁！';
    $('desc').textContent = '这是一节黄色的 1 号线列车。按绿色的「开始」按钮，一步一步把它拼出来吧！';
  } else {

  $('btnExplode').textContent = S.explodeT ? '🧲 合起来' : '💥 拆开看';
  $('views').style.display = built() ? 'flex' : 'none';
  $('btnMetro').style.display = built() ? '' : 'none';
  $('btnMetro').textContent = M.on ? '🌳 回地面' : '🚇 坐地铁';

function setCars(n, animate){
  const old = S.cars; S.cars = n;
  mids.forEach((c,i) => { if (i < n-2 && !(i < old-2)) c.userData.slide = animate ? 60 + i*25 : 0; });
  tail.userData.slide = animate && n >= 2 ? 60 + Math.max(0, n-2)*25 : 0;
  const w = n*21 + 14; sun.shadow.camera.left = -w; sun.shadow.camera.right = w; sun.shadow.camera.updateProjectionMatrix();
}
function finishAnims(){ items.forEach(it => { it.anim = null; }); }
function goStep(n, quiet){
  n = Math.max(0, Math.min(N, n)); finishAnims();
  const prev = S.step; S.step = n;
  setCars(n >= N ? MAXCARS : 1, !quiet && prev < N);
  if (n < N){ if (M.on) metroExit(); if (view !== 'orbit') setView('orbit'); S.driving = false; S.doorT = 0; S.pantoT = 0; if (S.lights) toggleLights(); }
  const now = performance.now();
  const fresh = items.filter(it => it.b.step > prev && it.b.step <= n)
                     .sort((a,b) => a.b.step - b.b.step || a.target.y - b.target.y || a.target.x - b.target.x);
  const gap = quiet ? 0 : Math.min(70, 1700/Math.max(1,fresh.length));
  items.forEach(it => { it.obj.visible = it.b.step <= n; });
  if (!quiet) fresh.forEach((it,i) => { it.anim = { t0: now + i*gap, dur: 520 }; it.obj.visible = false; });
  renderPanel();
  if (!quiet && n > 0){
    say(STEPS[n].t + '。' + STEPS[n].d);
    if (n === N && prev < N) setTimeout(celebrate, 4200);
  }
}

  const em = ['🎉','⭐','🚇','🟡','🔴','🎊'];
  for (let i=0;i<36;i++){ const s = document.createElement('span'); s.className = 'confetti'; s.textContent = em[i%em.length];
    s.style.left = Math.random()*100+'vw'; s.style.animationDuration = (1.8+Math.random()*1.8)+'s'; s.style.animationDelay = Math.random()*.6+'s';
    document.body.appendChild(s); setTimeout(() => s.remove(), 4500); }
}

let hum = null;
function humSet(v){
  if (!hum){ const a = ac(); if (!a) return; const o = a.createOscillator(), f = a.createBiquadFilter(), g = a.createGain();
    o.type = 'sawtooth'; f.type = 'lowpass'; f.frequency.value = 520; g.gain.value = 0; o.connect(f); f.connect(g); g.connect(a.destination); o.start(); hum = { o, g }; }
  const t = AC.currentTime; hum.o.frequency.setTargetAtTime(52 + v*5.2, t, .12); hum.g.gain.setTargetAtTime(soundOn ? Math.min(.06, v*.004) : 0, t, .12);
}

function hasVoice(pre){ try { return speechSynthesis.getVoices().some(v => v.lang.replace('_','-').toLowerCase().indexOf(pre) === 0); } catch(e){ return false; } }
function announce(zh, yue, en){
  if (!soundOn || !window.speechSynthesis) return;
  try { speechSynthesis.cancel();
    [[zh,'zh-CN',true],[yue,'zh-HK',hasVoice('zh-hk')],[en,'en-US',hasVoice('en')]].forEach(a => { if (!a[0] || !a[2]) return;
      const u = new SpeechSynthesisUtterance(a[0]); u.lang = a[1]; u.rate = .95; speechSynthesis.speak(u); });
  } catch(e){}
}

function updateCamera(e){
  if (view === 'orbit'){
    const cx = M.on ? train.position.x : 0, half = M.on ? 21 : S.half;
    const d = Math.max((half*1.18+10)/TH, 15/TV)*zoom*(1 + e*.25), ty = 2.6 + e*2.2;
    camera.position.set(cx + d*Math.sin(pol)*Math.sin(az), ty + d*Math.cos(pol), d*Math.sin(pol)*Math.cos(az));
    camera.lookAt(cx, ty, 0);
  } else {
    const c = view === 'cab' ? [-20.7, 3.7, 0] : [-.6, 3.95, -.8], cp = Math.cos(lookP);
    camera.position.set(train.position.x + c[0], train.position.y + c[1], c[2]);
    camera.lookAt(camera.position.x - Math.cos(lookY)*cp, camera.position.y + Math.sin(lookP), camera.position.z + Math.sin(lookY)*cp);

function metroSpeed(dt){

const pts = new Map(); let pinch = 0, hintGone = false;
function hideHint(){ if (!hintGone){ hintGone = true; $('hint').style.opacity = 0; } }
canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); pts.set(e.pointerId, {x:e.clientX,y:e.clientY}); pinch = 0; ac(); });
canvas.addEventListener('pointermove', e => {
  const p = pts.get(e.pointerId); if (!p) return;
  if (pts.size === 1){
    if (view === 'orbit'){ az -= (e.clientX-p.x)*.007; pol = Math.max(.2, Math.min(1.5, pol - (e.clientY-p.y)*.006)); }
    else { lookY += (e.clientX-p.x)*.005; if (view === 'cab') lookY = Math.max(-1.4, Math.min(1.4, lookY));
           lookP = Math.max(-.7, Math.min(.7, lookP + (e.clientY-p.y)*.004)); }
    hideHint(); }
  p.x = e.clientX; p.y = e.clientY;
  if (pts.size === 2){ const a = [...pts.values()], d = Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y); if (pinch) zoom = clampZoom(zoom * pinch/d); pinch = d; hideHint(); }
});
const up = e => { pts.delete(e.pointerId); pinch = 0; };
canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
canvas.addEventListener('wheel', e => { e.preventDefault(); zoom = clampZoom(zoom * Math.exp(e.deltaY*.0012)); hideHint(); }, { passive:false });
// iPad Safari 会忽略 user-scalable=no：这里拦掉双击放大和页面级的双指缩放
['gesturestart','gesturechange','gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive:false }));
document.addEventListener('dblclick', e => e.preventDefault(), { passive:false });
let lastTouchEnd = 0;
document.addEventListener('touchend', e => {
  const n = Date.now();
  if (n - lastTouchEnd < 350 && !e.target.closest('button')) e.preventDefault();
  lastTouchEnd = n;
}, { passive:false });
document.addEventListener('touchmove', e => { if (e.touches.length > 1 && e.target !== canvas) e.preventDefault(); }, { passive:false });
function clampZoom(z){ return Math.max(.14, Math.min(1.7, z)); }

function resize(){
  const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return;
  renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix();
  const tv = Math.tan(camera.fov*Math.PI/360), th = tv*camera.aspect;
  TH = th; TV = tv;
}
new ResizeObserver(resize).observe(stage); resize();

/* ───────── 动画循环 ───────── */
function bounce(p){ const n = 7.5625, d = 2.75;
  if (p < 1/d) return n*p*p; if (p < 2/d) return n*(p-=1.5/d)*p+.75; if (p < 2.5/d) return n*(p-=2.25/d)*p+.9375; return n*(p-=2.625/d)*p+.984375; }
const approach = (v,t,k) => Math.abs(t-v) < .002 ? t : v + (t-v)*k;
let last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now-last)/1000); last = now;
  S.explode = approach(S.explode, S.explodeT, Math.min(1, dt*6));
  S.door    = approach(S.door, S.doorT, Math.min(1, dt*4));
  S.panto   = approach(S.panto, S.pantoT, Math.min(1, dt*3));
  pantos.forEach(p => p.userData.set(S.panto));

  // 开车：门关好、受电弓升起才加速
  if (M.on) metroSpeed(dt); else {
    const go = S.driving && S.door < .03 && S.panto > .9 && S.explode < .05;
    S.speed += ((go ? 15 : 0) - S.speed) * Math.min(1, dt*(go ? .9 : 1.6));
    if (S.speed < .05) S.speed = 0;
  }
  if (S.pendingDoor && S.speed < .4){ S.pendingDoor = false; S.doorT = 1; sfx.chime(); renderPanel(); }
  const dx = S.speed*dt; S.dist += dx;
  if (M.on) metroTick();
  if (dx){
    wheels.forEach(w => w.rotation.z += dx/.7*w.userData.sgn);
    sleepers.position.x = S.dist % 2;
    groundTex.offset.x = -(S.dist/2) % 1;
    scenery.children.forEach(o => { let x = o.userData.x0 + S.dist; x = ((x + WRAP) % (2*WRAP) + 2*WRAP) % (2*WRAP) - WRAP; o.position.x = x; });
    if (S.dist > S.clackAt){ S.clackAt = S.dist + (M.on ? 26 : 7); sfx.clack(); }
  }
  train.position.y = 1.58 + (S.speed > 1 ? Math.sin(now*.02)*.018 : 0);

  const e = S.explode, o = S.door;
  for (const it of items){
    const p = it.obj.position; p.copy(it.target).addScaledVector(it.ex, e);
    if (it.b.door){ p.x += it.b.door.dir*.95*o; p.z += (it.target.z < 0 ? 1 : -1)*.24*Math.min(1, o*5); }
    if (it.anim){
      const k = (now - it.anim.t0)/it.anim.dur;
      if (k < 0) it.obj.visible = false;
      else if (k >= 1){ it.anim = null; it.obj.visible = true; sfx.click(); }
      else { it.obj.visible = true; p.y += (1-bounce(k))*14; }
    }
  }

  doorLeaves.forEach(g => g.position.set(g.userData.dir*.95*o, 0, g.userData.sgn*.24*Math.min(1, o*5)));
  if (S.speed > .5) spinners.forEach(f => f.rotation.y += dt*12);

  // 后面的车厢：一节一节开过来挂上；拆开看的时候先藏起来
  const show = S.explodeT === 0, effN = show ? S.cars : 1;
  const place = (c, on, idx) => { c.visible = on; if (!on) return;
    let sl = c.userData.slide; if (sl > 0){ sl *= 1 - Math.min(1, dt*2.6); if (sl < .04){ sl = 0; sfx.clack(); } c.userData.slide = sl; }
    c.position.x = idx*PITCH + sl; };
  mids.forEach((c,i) => place(c, show && i < S.cars-2, i+1));
  place(tail, show && S.cars >= 2, S.cars-1);
  const k = Math.min(1, dt*3);
  S.trainX = approach(S.trainX, -(effN-1)*PITCH/2, k); train.position.x = S.trainX;
  S.half = approach(S.half, effN*21, k);

  interior0.visible = built() && e < .01 && !S.explodeT;
  updateCamera(e);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

let saved = 0; try { saved = +localStorage.getItem('gzmetro-step') || 0; } catch(e){}
goStep(saved, true);
requestAnimationFrame(frame);
window.__metro = { S, M, goStep, items, setView }; // 调试用
})();
</script>
