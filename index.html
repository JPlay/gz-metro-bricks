<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1d2b3a">
<title>坐地铁 · 广州 3D 探险</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<!-- 图标（SVG 符号，按钮里用 <use> 引用） -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-eye3" viewBox="0 0 48 48"><circle cx="24" cy="15" r="6.5" fill="currentColor"/><path d="M13 39c0-7 5-12 11-12s11 5 11 12" fill="currentColor"/><path d="M6 30c3-3 6-4.5 9-5M42 30c-3-3-6-4.5-9-5" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none" opacity=".55"/></symbol>
    <symbol id="i-eye1" viewBox="0 0 48 48"><path d="M4 24s7.5-12 20-12 20 12 20 12-7.5 12-20 12S4 24 4 24z" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linejoin="round"/><circle cx="24" cy="24" r="6.5" fill="currentColor"/><circle cx="26.2" cy="21.8" r="2" fill="#fff"/></symbol>
    <symbol id="i-foot" viewBox="0 0 48 48"><ellipse cx="17" cy="29" rx="6" ry="9" fill="currentColor" transform="rotate(-12 17 29)"/><circle cx="12.5" cy="16" r="2.4" fill="currentColor"/><circle cx="17.5" cy="14.5" r="2.4" fill="currentColor"/><circle cx="22" cy="16.5" r="2.2" fill="currentColor"/><ellipse cx="32" cy="21" rx="5.2" ry="8" fill="currentColor" transform="rotate(10 32 21)" opacity=".7"/><circle cx="30" cy="9.5" r="2.1" fill="currentColor" opacity=".7"/><circle cx="34.5" cy="9" r="2.1" fill="currentColor" opacity=".7"/><circle cx="38" cy="11.5" r="1.9" fill="currentColor" opacity=".7"/></symbol>
    <symbol id="i-sound" viewBox="0 0 48 48"><path d="M8 19h7l10-8v26l-10-8H8z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M31 18c2 1.6 3 3.6 3 6s-1 4.4-3 6M36 13c3.4 2.8 5 6.4 5 11s-1.6 8.2-5 11" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></symbol>
    <symbol id="i-mute" viewBox="0 0 48 48"><path d="M8 19h7l10-8v26l-10-8H8z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M32 19l10 10M42 19L32 29" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/></symbol>
    <symbol id="i-jump" viewBox="0 0 48 48"><path d="M24 7L10 22h8v10h12V22h8z" fill="currentColor" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><rect x="16" y="36" width="16" height="4.5" rx="2.25" fill="currentColor" opacity=".55"/></symbol>
    <symbol id="i-metro" viewBox="0 0 48 48"><rect x="9" y="5" width="30" height="31" rx="9" fill="currentColor"/><rect x="14" y="11" width="20" height="10" rx="3" fill="#fff" opacity=".92"/><circle cx="17" cy="28.5" r="2.6" fill="#fff"/><circle cx="31" cy="28.5" r="2.6" fill="#fff"/><path d="M15 36l-5 7M33 36l5 7" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/></symbol>
  </defs>
</svg>
<canvas id="c" touch-action="none"></canvas>

<!-- 触摸层：左半边摇杆，右半边拖动转视角 / 双指缩放 -->
<div id="touch"></div>
<div id="stick" hidden><i class="chev u"></i><i class="chev d"></i><i class="chev l"></i><i class="chev r"></i><div class="knob"></div></div>
<div id="stickHint"><i class="chev u"></i><i class="chev d"></i><i class="chev l"></i><i class="chev r"></i><div class="knob"></div></div>

<!-- HUD -->
<div id="hud">
  <div id="where" class="glass">
    <span class="line" id="whereLine">1号线</span>
    <span class="names"><span class="name" id="whereName">公园前</span><span class="en" id="whereEn">Gongyuanqian</span></span>
  </div>
  <div id="next" class="glass dark" hidden></div>
  <div id="btns">
    <button id="bView" class="btn glass" aria-label="切换第一/第三人称"><svg class="ico"><use href="#i-eye3"/></svg><span class="lbl">视角</span></button>
    <button id="bFoot" class="btn glass" aria-label="发光脚印"><svg class="ico"><use href="#i-foot"/></svg><span class="lbl">脚印</span></button>
    <button id="bMute" class="btn glass" aria-label="声音"><svg class="ico"><use href="#i-sound"/></svg><span class="lbl">声音</span></button>
  </div>
  <button id="bJump" class="btn big" aria-label="跳"><svg class="ico"><use href="#i-jump"/></svg><span class="lbl">跳</span></button>
  <div id="toast" class="glass" hidden></div>
</div>
<div id="caption" class="glass dark" hidden><span class="lang"></span><span class="text"></span></div>

<div id="loading">
  <div class="box">
    <svg class="logo"><use href="#i-metro"/></svg>
    <div class="title">坐地铁 · 广州</div>
    <div class="sub">Guangzhou Metro 3D</div>
    <div class="bar"><i id="loadBar"></i></div>
    <div id="loadMsg">正在加载 3D 引擎…</div>
  </div>
</div>

<script src="js/boot.js"></script>
</body>
</html>
