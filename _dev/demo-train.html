</style></head><body><canvas id="view"></canvas><header><small>广州地铁 · 积木世界</small><h1>坐进黄色 1 号线</h1><p>沿着贯通车厢看过去，扶好扶手，准备出发。</p></header><a class="back" href="demo-station.html">车站体验 ↗</a><div id="readout"></div><div id="hint">拖动屏幕转头 · 点按钮切换体验</div><div id="toolbar"><button data-view="stand" class="on">站着看</button><button data-view="seat">坐长椅</button><button data-view="door">门口看</button><button data-view="outside">看六节车</button><button id="doors">开车门</button><button id="run">隧道出发</button><button id="next">下一站</button><button id="lights">车灯亮着</button></div><div id="error"></div>
<script>window.worldErrors=[];window.worldConsoleErrors=[];var worldOriginalConsoleError=console.error;console.error=function(){worldConsoleErrors.push(Array.from(arguments).map(String).join(" "));worldOriginalConsoleError.apply(console,arguments);};addEventListener("error",function(e){window.worldErrors.push(e.message);var el=document.getElementById("error");el.style.display="block";el.textContent=e.message;});</script><script src="../three.min.js"></script><script src="../js/metro/config.js"></script><script src="../js/metro/train.js?v=world-round3-14"></script><script src="../js/metro/station.js?v=world-round3-14"></script><script src="../js/metro/npc.js"></script>
<script>
(function(){'use strict';var T=THREE,canvas=document.getElementById('view'),renderer=new T.WebGLRenderer({canvas:canvas,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.outputEncoding=T.sRGBEncoding;renderer.shadowMap.enabled=false;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1;var scene=new T.Scene();scene.background=new T.Color('#142630');scene.fog=new T.Fog('#142630',190,500);scene.add(new T.HemisphereLight('#fff8e7','#637c87',.95));var sun=new T.DirectionalLight('#fff9e9',.65);sun.position.set(-30,60,20);scene.add(sun);var camera=new T.PerspectiveCamera(68,1,.1,800);camera.rotation.order='YXZ';var train=GZ.Train.create(),tunnel=GZ.Station.buildTunnel();scene.add(train.group,tunnel.group);tunnel.group.visible=false;var station=GZ.Station.build({station:GZ.config.STATIONS[0]});station.group.position.z=-station.tracks[0].z;station.setZone('platform');scene.add(station.group);window.worldTextureWarmup=[train.prewarmTextures(renderer),station.prewarmTextures(renderer),tunnel.prewarmTextures(renderer)];var crowd=GZ.NPC?GZ.NPC.create({parent:train.group,count:30}):null;if(crowd){var nearSeats=train.seats.filter(function(p){return p.car===2||p.car===3;});for(var ci=0;ci<18;ci++){var seat=nearSeats[ci*2];crowd.place(ci,{x:seat.x,y:seat.y-.6,z:seat.z},{seated:true,yaw:seat.yaw});}for(ci=18;ci<24;ci++)crowd.setPath(ci,[{x:-10+(ci-18)*5,y:2,z:ci%2?1.1:-1.1},{x:12+(ci-18)*5,y:2,z:ci%2?1.1:-1.1}],{speed:1.8,delay:(ci-18)*.5});var grips=train.strapSpots.filter(function(p){return p.car===3;});for(ci=24;ci<30;ci++){if(ci%6){var grip=grips[(ci-24)%grips.length];crowd.place(ci,grip.stand,{yaw:grip.yaw,pose:'strap'});}else crowd.place(ci,{x:14,y:2,z:1.5},{yaw:Math.PI/2});}}
var base=new T.Vector3(),yaw=-Math.PI/2,pitch=-.02,view='stand',running=false,speed=0,door=0,doorT=0,light=true,current=0,clock=0,last=0,frames=0,total=0,fps=0,drag=null;
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}addEventListener('resize',resize);resize();
function setView(name){view=name;tunnel.group.visible=running&&name!=='outside';station.group.visible=!running&&name!=='outside';document.querySelectorAll('[data-view]').forEach(function(b){b.classList.toggle('on',b.dataset.view===name);});camera.fov=name==='outside'?46:68;camera.updateProjectionMatrix();if(name==='stand'){base.set(-17.5,5.4,0);yaw=-Math.PI/2;pitch=-.015;}if(name==='seat'){var ds=train.seats.filter(function(p){return p.car===2&&p.z>0;})[9];base.set(ds.x,ds.y+2.4,ds.z-Math.sign(ds.z)*.6);yaw=ds.yaw+Math.PI;pitch=-.06;}if(name==='door'){base.set(-6.1,5.4,-3);yaw=0;pitch=-.02;}if(name==='outside'){base.set(-150,80,185);camera.position.copy(base);camera.lookAt(0,4,0);yaw=camera.rotation.y;pitch=camera.rotation.x;}document.getElementById('hint').textContent=name==='outside'?'六节编组 · 两端驾驶室 · 黄车身红腰线':'拖动屏幕转头 · 看门上的线路图和窗外';}
function route(){station.setStation(GZ.config.STATIONS[current]);tunnel.setStation(GZ.config.STATIONS[Math.min(3,current+1)]);train.setRoute({stations:GZ.config.STATIONS,currentIdx:current,nextIdx:Math.min(3,current+1),dir:1});}route();setView('stand');
document.querySelectorAll('[data-view]').forEach(function(b){b.onclick=function(){setView(b.dataset.view);};});document.getElementById('doors').onclick=function(){if(running){running=false;tunnel.group.visible=false;station.group.visible=view!=='outside';document.getElementById('run').textContent='隧道出发';}doorT=doorT?0:1;this.textContent=doorT?'关车门':'开车门';};document.getElementById('run').onclick=function(){running=!running;doorT=0;document.getElementById('doors').textContent='开车门';this.textContent=running?'到站停车':'隧道出发';tunnel.group.visible=running&&view!=='outside';station.group.visible=!running&&view!=='outside';this.classList.toggle('on',running);};document.getElementById('next').onclick=function(){current=(current+1)%4;route();document.querySelector('header p').textContent='本站：'+GZ.config.STATIONS[current].name+' · 下一站 '+GZ.config.STATIONS[Math.min(3,current+1)].name;};document.getElementById('lights').onclick=function(){light=!light;train.setLights(light);this.textContent=light?'车灯亮着':'车灯熄灭';};
canvas.addEventListener('pointerdown',function(e){drag={id:e.pointerId,x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);});canvas.addEventListener('pointermove',function(e){if(!drag||drag.id!==e.pointerId)return;yaw-=(e.clientX-drag.x)*.004;pitch=Math.max(-1.1,Math.min(1.1,pitch-(e.clientY-drag.y)*.003));drag.x=e.clientX;drag.y=e.clientY;});canvas.addEventListener('pointerup',function(){drag=null;});canvas.addEventListener('pointercancel',function(){drag=null;});['gesturestart','gesturechange','gestureend','dblclick'].forEach(function(e){document.addEventListener(e,function(e){e.preventDefault();},{passive:false});});
var errors=window.worldErrors;addEventListener('error',function(e){errors.push(e.message);document.getElementById('error').style.display='block';document.getElementById('error').textContent=e.message;});
function frame(ms){var dt=Math.min(.05,(ms-last)/1000||.016);last=ms;clock+=dt;speed+=(Number(running)-speed)*Math.min(1,dt*.8);door+=Math.sign(doorT-door)*Math.min(Math.abs(doorT-door),dt/train.doorDuration);train.setDoors(-1,door);station.psd.setOpen(0,door);station.update(dt);train.update(dt,speed);if(crowd){crowd.avoidPlayer(base.x,base.y-3.4,base.z,1.4);crowd.update(dt);}if(tunnel.group.visible)tunnel.update(dt,speed);camera.position.copy(base);camera.rotation.set(pitch,yaw,view==='outside'?0:Math.sin(clock*2.5)*speed*.002,'YXZ');renderer.render(scene,camera);frames++;total+=dt;if(total>=1){fps=Math.round(frames/total);frames=0;total=0;document.getElementById('readout').innerHTML='<b>'+fps+' 帧/秒</b> · '+renderer.info.render.calls+' 次绘制<br>车内净宽 8.8 · 净高 7.2<br>'+train.doors.length+' 个门口 · '+train.seats.length+' 个座位';}requestAnimationFrame(frame);}requestAnimationFrame(frame);
function inspect(pos,target){base.set(pos.x,pos.y,pos.z);camera.position.copy(base);camera.lookAt(target.x,target.y,target.z);yaw=camera.rotation.y;pitch=camera.rotation.x;}
window.worldDemo={train:train,tunnel:tunnel,station:station,scene:scene,camera:camera,renderer:renderer,inspect:inspect,crowd:crowd,errors:errors,setView:setView,state:function(){return{view:view,running:running,speed:speed,door:door,current:current,fps:fps,calls:renderer.info.render.calls};}};
})();
</script></body></html>
