var base=new T.Vector3(),yaw=0,pitch=-.04,view='street',dir=1,current=0,door=0,doorT=0,clock=0,last=0,frames=0,total=0,fps=0,drag=null,touring=false,tourPath=[],tourIdx=0,tourTarget=new T.Vector3(),approaching=false,approachTime=0,errors=window.worldErrors;

function startArrival(){setView('platform');base.set(dir===1?-102:102,5.4,dir===1?7.1:-7.1);approaching=true;approachTime=0;door=doorT=0;train.setDoors(0,0);station.psd.setOpen(station.activeTrackIdx,0);train.group.position.x=-dir*415;train.group.visible=true;face({x:-dir*137,z:station.tracks[station.activeTrackIdx].z});station.pids.set({trackIdx:station.activeTrackIdx,minutes:'即将进站'});document.getElementById('hint').textContent='车头灯从黑暗中驶出 · 停稳后先下后上';}

canvas.addEventListener('pointerdown',function(e){drag={id:e.pointerId,x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);});canvas.addEventListener('pointermove',function(e){if(!drag||drag.id!==e.pointerId)return;yaw-=(e.clientX-drag.x)*.004;pitch=Math.max(-1.1,Math.min(1.1,pitch-(e.clientY-drag.y)*.003));drag.x=e.clientX;drag.y=e.clientY;});canvas.addEventListener('pointerup',function(){drag=null;});canvas.addEventListener('pointercancel',function(){drag=null;});['gesturestart','gesturechange','gestureend','dblclick'].forEach(function(e){document.addEventListener(e,function(e){e.preventDefault();},{passive:false});});

function frame(ms){var dt=Math.min(.05,(ms-last)/1000||.016);last=ms;clock+=dt;station.update(dt);train.update(dt,approaching?1-Math.min(1,approachTime/15):0);if(crowd){crowd.avoidPlayer(base.x,base.y-3.4,base.z);crowd.update(dt);}door+=Math.sign(doorT-door)*Math.min(Math.abs(doorT-door),dt/train.doorDuration);station.psd.setOpen(station.activeTrackIdx,door);train.setDoors(station.tracks[station.activeTrackIdx].side,door);

 if(touring&&tourIdx<tourPath.length){var p=tourPath[tourIdx];tourTarget.set(p.x,p.y+GZ.config.EYE_H,p.z);var dist=base.distanceTo(tourTarget),k=Math.min(1,dt*(p.kind==='escalator'?3.2:11)/Math.max(.001,dist));if(!drag&&dist>.1){var targetYaw=Math.atan2(-(p.x-base.x),-(p.z-base.z));yaw+=Math.atan2(Math.sin(targetYaw-yaw),Math.cos(targetYaw-yaw))*Math.min(1,dt*3);}base.lerp(tourTarget,k);var ground=station.sampleGround(base.x,base.z,base.y-GZ.config.EYE_H);if(ground&&Math.abs(ground.y+GZ.config.EYE_H-base.y)<.85)base.y=ground.y+GZ.config.EYE_H;if(k>=1)tourIdx++;var z=base.y>26?'street':base.y>12?'concourse':'platform';station.setZone(z);if(z!==view){view=z;people(z);}train.group.visible=z==='platform';if(tourIdx===tourPath.length){touring=false;view='platform';document.getElementById('hint').textContent='到站台啦！站在黄线后面，先下后上。';}}
