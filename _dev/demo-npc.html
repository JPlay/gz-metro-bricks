<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%23F6CF1B%27/%3E%3Cpath d=%27M14 43h36v6H14zM18 14h28v26H18z%27 fill=%27%23233447%27/%3E%3C/svg%3E"><title>会走路的积木乘客 · NPC 验收</title><link rel="stylesheet" href="../css/metro.css?v=play-round3-22"><style>#controls{position:absolute;left:20px;right:20px;top:20px;display:flex;gap:10px;flex-wrap:wrap}#stats{position:absolute;bottom:20px;left:20px;background:#fffdf4;padding:18px;border-radius:18px;font-weight:800}canvas{width:100%;height:100%}#controls button{font-size:15px}</style></head><body><canvas id="c"></canvas><div id="controls"><button data-mode="walk">60人走路 · 避让</button><button data-mode="queue">排队与上下车</button><button data-mode="escalator">乘扶梯</button><button data-mode="train">车内走动与坐下</button><a href="../metro.html" style="padding:16px;background:white;border-radius:18px">打开完整旅程</a></div><div id="stats"></div><script src="../three.min.js"></script><script src="../js/metro/config.js"></script><script src="../js/metro/train.js?v=world-round3-14"></script><script src="../js/metro/station.js?v=world-round3-14"></script><script src="../js/metro/play-physics.js?v=play-round3-22"></script><script src="../js/metro/npc.js?v=play-round3-22"></script><script>
(function(){'use strict';
var T=THREE,scene=new T.Scene();scene.background=new T.Color(0xc7e4ee);
var camera=new T.PerspectiveCamera(65,innerWidth/innerHeight,.12,900),r=new T.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.setSize(innerWidth,innerHeight);r.outputEncoding=T.sRGBEncoding;
scene.add(new T.HemisphereLight(0xffffff,0x75919b,1));var light=new T.DirectionalLight(0xfff4dd,.8);light.position.set(20,70,30);scene.add(light);
var train=GZ.Train.create();scene.add(train.group);train.group.position.z=14.95;
var station=GZ.Station.build({station:GZ.config.STATIONS[0],dir:1,doorXs:train.doors.filter(function(d){return d.side===-1;}).map(function(d){return d.x;})});scene.add(station.group);for(var warmModule of [station,train])if(warmModule.prewarmTextures)warmModule.prewarmTextures(r);
var crowd=GZ.NPC.create({scene:scene,count:60}),runtime=new GZ.PlayPhysics.Runtime(station,train),auditEnabled=new URLSearchParams(location.search).get('audit')==='1',geometry=auditEnabled?new GZ.PlayPhysics.Geometry([station.group,train.group],crowd.group):null,current='walk';crowd.enableFast(runtime);
window.crowd=crowd;
function spread(id,route,f,opts){crowd.setPath(id,route,opts||{speed:2.8});var a=crowd.actors[id],total=0,k,end=opts&&opts.loop===false?route.length-1:route.length;for(k=0;k<end;k++){var p=route[k],q=route[(k+1)%route.length];total+=Math.hypot(q.x-p.x,q.y-p.y,q.z-p.z);}var d=total*f;for(k=0;k<end;k++){var p=route[k],q=route[(k+1)%route.length],l=Math.hypot(q.x-p.x,q.y-p.y,q.z-p.z);if(d<=l){a.position.set(p.x+(q.x-p.x)*d/l,p.y+(q.y-p.y)*d/l,p.z+(q.z-p.z)*d/l);a.pathIndex=(k+1)%route.length;break;}d-=l;}}
function setPhysics(){var attached=current==='train';runtime.attached=attached;crowd.colliders=runtime;crowd.ground=function(p){return runtime.ground(p,attached);};if(auditEnabled)crowd.groundExact=function(p){var g=geometry.ground(p.clone().add(attached?train.group.position:runtime.zero));return g?{y:g.y}:null;};crowd.escalators=attached?[]:station.escalators;crowd.avoidPlayer(camera.position.x,camera.position.y-3.4,camera.position.z-(attached?train.group.position.z:0),5);}
function mode(name){current=name;crowd.hideAll();crowd.attach(name==='train'?train.group:scene);train.group.visible=name==='train';station.group.visible=name!=='train';if(geometry)geometry.sync();var i,route,p;
 if(name==='walk'||name==='escalator'){
  route=[{x:-72,y:28,z:52},{x:26,y:28,z:52},{x:26,y:28,z:58.4},{x:-72,y:28,z:58.4}];
  for(i=0;i<(name==='walk'?60:40);i++)spread(i,route,i/(name==='walk'?60:40));
  if(name==='escalator')for(i=40;i<60;i++)spread(i,station.nav.paths.enter,(i-40+.25)/20,{loop:false,speed:3.1});
  camera.position.set(name==='walk'?-76:-70,name==='walk'?31.4:24.9,name==='walk'?52:27);camera.lookAt(name==='walk'?new T.Vector3(-50,29,64):new T.Vector3(-58,18,27));
 }else if(name==='queue'){
  route=[{x:-112,y:2,z:-6.1},{x:112,y:2,z:-6.1},{x:112,y:2,z:6.1},{x:-112,y:2,z:6.1}];for(i=0;i<38;i++)spread(i,route,i/38);
  var spots=station.nav.platformDoorSpots;for(i=38;i<60;i++){p=spots[Math.floor((i-38)/2)*2];crowd.place(i,{x:p.x+(i%2?2.4:-2.4),y:2,z:p.z-.8});}
  camera.position.set(-4,5.4,0);camera.lookAt(-4,4,8);
 }else{
  crowd.reservedCar=2;crowd.reservedDoorX=-6.1;var grips=train.strapSpots.filter(function(p){return p.car!==2;}),chosen=[];
  for(i=48;i<60;i++){p=grips[Math.floor((i-48)*grips.length/12)];chosen.push(p);crowd.actors[i].scale=1;crowd.place(i,p.stand||p.standPosition,{pose:'strap',yaw:p.yaw});crowd.actors[i].strapAnchor=p;}
  var seats=train.seats.filter(function(s){return s.car!==2&&chosen.every(function(g){var p=g.stand||g.standPosition;return Math.hypot(s.x-p.x,s.z-p.z)>3.4;});});
  for(i=0;i<24;i++){p=seats[Math.floor(i*seats.length/24)];var top=runtime.ground(new T.Vector3(p.x,p.y+.4,p.z+train.group.position.z));crowd.place(i,{x:p.x,y:(top?top.y:p.y+.185)-.71*crowd.actors[i].scale+.008,z:p.z},{seated:true,yaw:p.yaw});}
  var standing=train.standSpots.filter(function(s){return s.car!==2||Math.abs(s.x+6.1)>14;});for(i=24;i<48;i++){if(i<30){var cx=train.cars[i-24].x;route=[{x:cx-1.7,y:2,z:0},{x:cx+.4,y:2,z:0}];spread(i,route,((i-24)%3)/3,{speed:1.3,pose:'normal'});}else{var stand=standing[Math.floor((i-30)*standing.length/18)];crowd.place(i,{x:stand.x,y:2,z:(i%2?1:-1)*.7},{yaw:i%2?Math.PI:0,pose:i%3?'normal':'phone'});}}
  camera.position.set(-6.1,5.4,14.95);camera.lookAt(-26,5,14.95);
 }
 setPhysics();crowd.advanceFast(0);crowd.update(0,true);document.querySelectorAll('[data-mode]').forEach(function(b){b.style.background=b.dataset.mode===name?'#f6cf1b':'white';});
}
function audit(){var overlap=0,staticHit=0,unsupportedFeet=0;for(var i=0;i<60;i++){var a=crowd.actors[i];if(!a.visible)continue;if(crowd.staticHit(a,a.position))staticHit++;if(!crowd.footContact(a).supported)unsupportedFeet++;for(var j=i+1;j<60;j++){var b=crowd.actors[j];if(b.visible&&Math.abs(a.position.y-b.position.y)<3.85*Math.max(a.scale,b.scale)&&Math.hypot(a.position.x-b.position.x,a.position.z-b.position.z)<GZ.PlayPhysics.npcRadius(a)+GZ.PlayPhysics.npcRadius(b)-.001)overlap++;}}return {overlap:overlap,staticHit:staticHit,unsupportedFeet:unsupportedFeet};}
window.npcDemo={inspect:function(pos,target){camera.position.set(pos.x,pos.y,pos.z);camera.lookAt(target.x,target.y,target.z);},stats:function(){return crowd.stats();},audit:audit,world:function(){return {station:station,train:train,crowd:crowd};}};
document.querySelectorAll('[data-mode]').forEach(function(b){b.onclick=function(){mode(b.dataset.mode);};});mode('walk');var last=0,frames=0,seconds=0;
function tick(t){var realDt=(t-last)/1000||.016,dt=Math.min(realDt,.1);last=t;station.update(dt);train.update(dt,0);if(geometry)geometry.sync();if(current==='escalator'){var step=runtime.stationField.ground(camera.position.x,camera.position.y-3.4,camera.position.z);if(step)camera.position.y=step.y+3.4;}setPhysics();crowd.advanceFast(dt);crowd.update(0,true);r.render(scene,camera);frames++;seconds+=realDt;if(seconds>1){var s=crowd.stats(),a=auditEnabled?audit():{overlap:"审计关",staticHit:"审计关"};document.getElementById('stats').textContent='60名积木乘客 · 正在走 '+s.walking+' 人 · 坐下 '+s.seated+' 人 · 重叠 '+a.overlap+' / 障碍接触 '+a.staticHit+' · '+Math.round(frames/seconds)+' FPS';frames=0;seconds=0;}requestAnimationFrame(tick);}requestAnimationFrame(tick);
addEventListener('resize',function(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();r.setSize(innerWidth,innerHeight);});
})();
</script></body></html>
